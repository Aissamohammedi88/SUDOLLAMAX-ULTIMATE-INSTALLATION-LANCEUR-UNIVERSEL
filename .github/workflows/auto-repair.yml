# ═══════════════════════════════════════════════════════════════════════════════
# NEXUS AUTO-REPAIR v2 — L'Usine de Nettoyage Souveraine (Blindée)
# ═══════════════════════════════════════════════════════════════════════════════
name: "🩺 Nexus Auto-Repair"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: write
  pull-requests: write
  workflows: write # <--- CRUCIAL : Autorise la modification des fichiers .yml dans .github/

jobs:
  repair:
    name: "🔧 Scan & Repair"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Setup Node (pour Prettier)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Tools
        run: |
          python -m pip install --upgrade pip
          pip install black
          npm install -g prettier

      - name: "1. Repair Python (Black) - Fichiers .py uniquement"
        continue-on-error: true
        run: |
          # On ne formate que les vrais fichiers Python, et on exclut les dossiers systèmes.
          # On ajoute '|| true' pour que si Black échoue, le workflow continue.
          find . -name "*.py" -not -path "*/node_modules/*" -not -path "*/.git/*" -not -path "*/venv/*" -exec black {} + || echo "⚠️ Attention: Certains fichiers .py sont peut-être des scripts Bash déguisés. Black les a ignorés."

      - name: "2. Repair YAML & JSON (Prettier) - Sans toucher à .github/"
        continue-on-error: true
        run: |
          # On exclut le dossier .github/ pour ne pas casser les workflows GitHub eux-mêmes
          find . \( -name "*.yml" -o -name "*.yaml" -o -name "*.json" \) \
            -not -path "*/node_modules/*" \
            -not -path "*/.git/*" \
            -not -path "*/.github/*" \
            | xargs -r prettier --write

      - name: "3. Vérifier si des modifications ont eu lieu"
        id: check_changes
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "changes=true" >> "$GITHUB_OUTPUT"
            echo "Des réparations ont été appliquées."
          else
            echo "changes=false" >> "$GITHUB_OUTPUT"
            echo "Aucune erreur détectée. Le code est déjà souverain."
          fi

      - name: "4. Ouvrir la Pull Request de réparation"
        if: steps.check_changes.outputs.changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "fix(auto-repair): correction automatique du code [skip ci]"
          title: "🩺 Auto-Repair : Correctifs appliqués"
          body: |
            ## 🤖 Rapport de l'Usine de Nettoyage
            
            Le robot Nexus a détecté des erreurs de syntaxe ou de formatage.
            Il a appliqué les outils suivants :
            - **Black** : Formatage des fichiers `.py` valides.
            - **Prettier** : Formatage des fichiers `.yml` et `.json` (hors `.github/`).
            
            **Note :** Si ton fichier `sudollamax.py` est un script Bash, renomme-le en `sudollamax.sh`. Black ne pourra jamais le formater.
          branch: auto-repair/fix-${{ github.run_id }}
          delete-branch: true
          labels: |
            auto-repair
            automated
