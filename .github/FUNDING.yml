# These are supported funding model platforms

udollamax — Appel aux bâtisseurs

Ce projet est né d’une idée simple : un lanceur universel pour tous les modèles IA, sans dépendance à un moteur unique.
Il est open source, gratuit, et ambitieux.

Chaque dollar donné ou chaque ligne de code contribuée servira à :

· Financer des chercheurs en IA pour tester et valider les modèles
· Payer des audits de sécurité pour garantir la fiabilité du lanceur
· Soutenir des développeurs full‑time qui maintiendront l’écosystème
· Créer un fonds d’innovation pour intégrer les prochains moteurs (TPU, JAX, etc.)

Tu veux aider ?

· 🔧 Code → Ouvre une PR ou une issue
· 💰 Finance → Chaque don est un levier pour libérer de la puissance de calcul
· 🧠 Idée → Propose, discute, construis avec nous

Sudollamax n’est pas un projet fermé. C’est un terrain de jeu pour ceux qui veulent que l’IA soit libre, modulaire, et accessible à tous.

Rejoins‑nous. Le code est là. Le futur s’écrit à plusieurs.
— Aissa Mohammedi, créateur de Sudollamax

